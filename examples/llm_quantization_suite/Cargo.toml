[package]
name = "llm_quantization_suite"
version = "0.1.0"
edition = "2021"
description = "Comprehensive test suite for LLM quantization using Fandango with HuggingFace integration"

[dependencies]
# Core Fandango dependencies
candle-core = "0.3.3"
candle-nn = "0.3.3"
candle-transformers = "0.3.3"

# HuggingFace integration
hf-hub = "0.3.2"
safetensors = "0.4.1"
tokenizers = "0.15.0"

# Async and HTTP
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Testing and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
rstest = "0.18"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4"] }
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
wiremock = "0.5"

[[bin]]
name = "llm_quantizer"
path = "src/bin/main.rs"

[[bench]]
name = "quantization_benchmarks"
harness = false

[features]
default = ["gpu"]
gpu = ["candle-core/cuda"]
metal = ["candle-core/metal"]
