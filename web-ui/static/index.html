<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fandango Web UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fandango - High-performance attention mechanisms for deep learning">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        :root {
            --primary: #6e56cf;
            --primary-hover: #5d3ec9;
            --primary-focus: rgba(110, 86, 207, 0.25);
            --color-bg: #f8f9fa;
            --color-bg-secondary: #ffffff;
            --color-text: #333333;
            --color-text-secondary: #666666;
            --color-border: #e5e7eb;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 0.25rem;
            --radius: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-full: 9999px;
            --transition: all 0.2s ease-in-out;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        /* Connection status bar */
        .connection-bar {
            background-color: var(--color-bg-secondary);
            border-bottom: 1px solid var(--color-border);
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Main content */
        .main-content {
            flex: 1;
            padding: 1rem 0;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 200px;
        }
        
        .spinner {
            width: 2rem;
            height: 2rem;
            border: 0.25rem solid rgba(110, 86, 207, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Utility classes */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .p-4 { padding: 1rem; }
        .m-0 { margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <header class="card">
            <h1>Fandango</h1>
            <p>High-performance attention mechanisms for deep learning</p>
        </header>
        
        <main>
            <div id="app">
                <div class="loading">
                    Loading application...
                </div>
            </div>
        </main>
        
        <footer class="text-center">
            <p>© 2025 Fandango Project</p>
        </footer>
    </div>
    
    <script type="module">
        import init, { run_app } from './fandango_web.js';
        
        async function run() {
            try {
                await init();
                await run_app();
            } catch (e) {
                console.error('Failed to initialize WebAssembly module:', e);
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        <h2>Error loading application</h2>
                        <p>${e.toString()}</p>
                        <p>Please check the console for more details.</p>
                    </div>
                `;
            }
        }
        
        run();
    </script>
</body>
</html>
