[package]
name = "fandango-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Web framework
yew = { version = "0.20", features = ["csr"] }
yew-router = "0.17"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "InputEvent", "MouseEvent", "KeyboardEvent"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Fandango workspace
fandango = { path = "..", features = ["visual-workspace"] }

# UI components
yew-feather = { version = "0.10", features = ["icons"] }
stylist = { version = "0.10", features = ["yew"] }

# For async runtime
wasm-bindgen-rayon = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
opt-level = 3
