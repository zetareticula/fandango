[package]
name = "fandango-quantization-server"
version = "0.1.0"
edition = "2021"
description = "High-performance quantization server for LLMs"
authors = ["Your Name <your.email@example.com>"]
license = "Apache-2.0"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
actix-http = "3.5.1"
actix-codec = "0.5.1"
actix-service = "2.0.2"
actix-utils = "3.0.1"
candle-core = { git = "https://github.com/huggingface/candle.git", features = ["metal"], default-features = false }
candle-nn = { git = "https://github.com/huggingface/candle.git", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
simple_logger = "4.2.0"
anyhow = "1.0"
thiserror = "1.0"
futures-util = { version = "0.3", features = ["std"] }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
