[package]
name = "fandango-quantization-server"
version = "0.1.0"
edition = "2021"
description = "High-performance quantization server for LLMs"
authors = ["Zeta Reticula <fandango@zetareticula.xyz>"]
license = "Apache-2.0"

[features]
default = []
benchmarks = ["criterion/plotters"]

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
actix-http = "3.5.1"
actix-codec = "0.5.1"
actix-service = "2.0.2"
actix-utils = "3.0.1"
candle-core = { git = "https://github.com/huggingface/candle.git", features = ["metal"], default-features = false }
candle-nn = { git = "https://github.com/huggingface/candle.git", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
simple_logger = "4.2.0"
anyhow = "1.0"
thiserror = "1.0"
futures-util = { version = "0.3", features = ["std"] }
port-check = "1.0"
rand = "0.8"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["full"] }
serial_test = "2.0"
proptest = "1.2"
port-check = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
pretty_assertions = "1.4"

[build-dependencies]
vergen = { version = "8.0", features = ["build", "git", "gitcl"] }

[[bench]]
name = "quantization_benchmark"
harness = false

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "property_tests"
path = "tests/property_tests.rs"

[profile.bench]
debug = false
opt-level = 3
lto = true
codegen-units = 1

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
