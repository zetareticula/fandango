[package]
name = "fandango"
version = "0.1.0"
edition = "2021"

description = "Fandango - High-performance attention mechanisms for deep learning"
authors = ["Your Name <your.email@example.com>"]
license = "Apache-2.0"
repository = "https://github.com/yourusername/fandango"
keywords = ["deep-learning", "attention", "transformer", "machine-learning"]
categories = ["machine-learning", "deep-learning"]

[lib]
path = "src/rust/lib.rs"
name = "fandango"

[[bin]]
name = "fandango"
path = "src/bin/main.rs"

[dependencies]
tokio = { version = "1.32", features = ["full", "rt-multi-thread", "macros"], optional = true }
log = "0.4"
candle-core = { git = "https://github.com/huggingface/candle.git", features = ["metal"], default-features = false }
candle-nn = { git = "https://github.com/huggingface/candle.git", default-features = false }
thiserror = "1.0"
anyhow = "1.0"
ndarray = { version = "0.15", features = ["rayon"], optional = true }
ndarray-stats = { version = "0.5", optional = true }
num-traits = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
rayon = { version = "1.8", optional = true }
rand = "0.8.5"
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
parking_lot = { version = "0.12", optional = true }
simple_logger = { version = "4.2.0", optional = true }
uuid = { version = "1.3", features = ["v4", "serde"], optional = true }
serde_derive = "1.0"
serde_with = "3.0"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement"], optional = true }
actix-web = { version = "4.4", features = ["macros"] }
actix-rt = { version = "2.9", features = ["macros"] }
actix-files = "0.6.2"
actix-web-actors = "4.2.0"
actix-http = "3.5.1"
actix-codec = "0.5.1"
actix-service = "2.0.2"
actix-utils = "3.0.1"
futures-util = { version = "0.3.28", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }



[dev-dependencies]
actix-rt = "2.5" # Runtime for testing

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = ["metal", "std", "visual-workspace"]
std = [
    "tokio",
    "ndarray",
    "serde",
    "rayon",
    "serde_json",
    "parking_lot",
    "simple_logger",
    "wasm-bindgen",
    "js-sys",
    "web-sys",
]
visual-workspace = [
    "serde", 
    "serde_json", 
    "uuid", 
    "wasm-bindgen", 
    "js-sys", 
    "web-sys",
    "ndarray",
    "ndarray-stats",
    "num-traits"
]
metal = ["candle-core/metal"]
cuda = ["candle-core/cuda"]
wasm = ["wasm-bindgen", "js-sys"]
quantized_model_loader = []
fused_attention = []
enterprise = [] # Enable privileged features for Enterprise tier

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false