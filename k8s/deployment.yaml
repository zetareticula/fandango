apiVersion: apps/v1
kind: Deployment
metadata:
  name: fandango-quantization-server
  labels:
    app: fandango
    component: quantization-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fandango
      component: quantization-server
  template:
    metadata:
      labels:
        app: fandango
        component: quantization-server
    spec:
      containers:
      - name: fandango-quantization-server
        image: fandango:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: RUST_LOG
          value: "info"
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: fandango-quantization-service
  labels:
    app: fandango
    component: quantization-server
spec:
  selector:
    app: fandango
    component: quantization-server
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fandango-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - fandango.example.com
    secretName: fandango-tls
  rules:
  - host: fandango.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fandango-quantization-service
            port:
              number: 80
